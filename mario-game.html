<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>URAYAMA RUNNER - レトロアクション</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    background: #05060f;
    font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 900px;
  }
  #wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 60px rgba(80,120,255,0.35), 0 0 120px rgba(255,60,180,0.2);
    border-radius: 14px;
    overflow: hidden;
    background: #05060f;
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px;
    color: #fff; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(120,180,255,0.9);
    pointer-events: none; font-size: clamp(11px, 2.4vw, 18px);
  }
  .hud-pill {
    background: rgba(10,15,40,0.55);
    border: 1px solid rgba(120,160,255,0.4);
    padding: 6px 12px; border-radius: 20px;
    backdrop-filter: blur(4px);
  }
  .hud-pill span { color: #5ff; }
  .coin-c span { color: #ffd34d; }
  .life-c span { color: #ff6b9d; }

  /* オーバーレイ画面 */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; color: #fff;
    background: radial-gradient(circle at 50% 40%, rgba(40,30,90,0.85), rgba(5,6,15,0.96));
    backdrop-filter: blur(2px);
    z-index: 10; padding: 20px;
  }
  .screen.hidden { display: none; }
  .title {
    font-size: clamp(34px, 9vw, 78px);
    font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg,#6cf,#a78bfa,#ff6bd6,#ffd34d);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(150,120,255,0.6));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .subtitle { margin-top:10px; font-size: clamp(12px,3vw,18px); color:#9fb4ff; letter-spacing:2px; }
  .btn {
    margin-top: 28px; pointer-events: auto; cursor: pointer;
    font-size: clamp(16px, 3.6vw, 24px); font-weight: 800;
    color: #06122a; padding: 14px 40px; border: none; border-radius: 40px;
    background: linear-gradient(90deg,#5ff,#a78bfa);
    box-shadow: 0 6px 0 rgba(40,60,150,0.6), 0 0 30px rgba(120,180,255,0.7);
    transition: transform .08s, box-shadow .08s; letter-spacing: 2px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(40,60,150,0.6); }
  .hint { margin-top: 22px; font-size: clamp(11px,2.6vw,15px); color:#7d8bc4; line-height:1.9; }
  .video-btn {
    display: inline-block; margin-top: 18px; pointer-events: auto;
    padding: 10px 28px; border-radius: 30px;
    background: linear-gradient(90deg, #c00, #ff2d5e);
    color: #fff; text-decoration: none;
    font-size: clamp(12px, 2.8vw, 16px); font-weight: 800; letter-spacing: 2px;
    box-shadow: 0 4px 0 rgba(120,0,0,0.5), 0 0 20px rgba(255,60,80,0.4);
    transition: transform .08s, box-shadow .08s;
  }
  .video-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(120,0,0,0.5); }
  .big-result { font-size: clamp(28px,7vw,60px); font-weight:900; }
  .win { color:#7CFFB2; text-shadow:0 0 25px rgba(124,255,178,0.8); }
  .lose { color:#ff6b8a; text-shadow:0 0 25px rgba(255,107,138,0.8); }

  /* モバイル操作（ゲーム画面の下に配置） */
  #touch {
    display: none;               /* PCでは非表示 */
    width: 100%;
    box-sizing: border-box;
    padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .dpad { display: flex; gap: 16px; }
  .tbtn {
    pointer-events: auto;
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(120,160,255,0.18);
    border: 2px solid rgba(150,190,255,0.55);
    color:#cfe0ff; font-size:30px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(3px); touch-action:none; -webkit-user-select:none;
  }
  .tbtn:active { background: rgba(120,160,255,0.4); transform: scale(0.94); }
  #btnJump {
    width: 100px; height: 100px; font-size: 22px;
    background: rgba(255,120,200,0.2); border-color: rgba(255,150,210,0.6); color:#ffd9ef;
  }
  /* タッチ端末のときだけ操作バーを表示 */
  @media (hover:none) and (pointer:coarse) { #touch{ display:flex; } }

  /* スマホ：タイトル/結果画面を縦に圧縮して1画面に収める */
  @media (max-width: 640px) {
    .screen { padding: 8px 12px; overflow-y: auto; }
    .title { font-size: clamp(22px, 8vw, 44px); letter-spacing: 2px; animation: none; }
    .subtitle { margin-top: 6px; font-size: 13px; }
    .btn { margin-top: 12px; padding: 10px 30px; font-size: 17px; }
    .hint { margin-top: 10px; font-size: 10.5px; line-height: 1.45; }
    .video-btn { margin-top: 10px; padding: 8px 22px; font-size: 12px; }
    .big-result { font-size: clamp(24px, 8vw, 40px); }
  }

  /* 裏技ポップアップ */
  #cheatPop {
    position:absolute; inset:0; z-index:30;
    display:none; align-items:center; justify-content:center;
    background:rgba(3,5,15,0.7); backdrop-filter:blur(4px);
  }
  #cheatPop.show { display:flex; }
  .cheat-box {
    background:linear-gradient(160deg,#141b3a,#0a0e22);
    border:1px solid rgba(120,160,255,0.5);
    border-radius:16px; padding:26px 28px; width:min(86%,360px);
    box-shadow:0 0 40px rgba(120,160,255,0.4); text-align:center; color:#fff;
  }
  .cheat-box h3 { font-size:18px; letter-spacing:2px; margin-bottom:6px;
    background:linear-gradient(90deg,#5ff,#a78bfa); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; }
  .cheat-box p { font-size:12px; color:#9fb4ff; margin-bottom:16px; }
  #cheatInput {
    width:100%; padding:12px 14px; border-radius:10px; font-size:16px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(120,160,255,0.45);
    color:#fff; text-align:center; letter-spacing:3px; outline:none; margin-bottom:8px;
  }
  #cheatInput:focus { border-color:#5ff; box-shadow:0 0 12px rgba(90,255,255,0.5); }
  #cheatMsg { font-size:12px; color:#ff6b8a; min-height:16px; margin-bottom:12px; }
  .cheat-btns { display:flex; gap:10px; }
  .cheat-btns button {
    flex:1; padding:11px 0; border:none; border-radius:24px; cursor:pointer;
    font-weight:800; font-size:14px; letter-spacing:1px;
  }
  #cheatOk { color:#06122a; background:linear-gradient(90deg,#5ff,#a78bfa); }
  #cheatCancel { color:#cfe0ff; background:rgba(255,255,255,0.08);
    border:1px solid rgba(120,160,255,0.4) !important; }
  /* Uボタン（裏技呼び出し） */
  #cheatBtn {
    position:absolute; right:14px; bottom:14px; z-index:9;
    width:46px; height:46px; border-radius:50%; cursor:pointer;
    background:rgba(20,28,60,0.6); border:1px solid rgba(120,160,255,0.5);
    color:#9fb4ff; font-weight:900; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(3px); opacity:0.55; transition:opacity .2s;
  }
  #cheatBtn:hover { opacity:1; }
</style>
</head>
<body>
<div id="stage">
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="hud">
    <div class="hud-pill">WORLD <span id="world">1-1</span></div>
    <div class="hud-pill coin-c">◆ <span id="coins">0</span></div>
    <div class="hud-pill life-c">♥ <span id="lives">3</span></div>
    <div class="hud-pill" id="soundBtn" style="pointer-events:auto;cursor:pointer">🔊</div>
  </div>

  <!-- タイトル -->
  <div id="startScreen" class="screen">
    <div class="title">URAYAMA RUNNER</div>
    <button class="btn" id="startBtn">▶ START</button>
    <div class="hint">
      PC: ← → 移動 ／ Space・↑ ジャンプ<br>
      スマホ: 画面下のボタンで操作<br>
      敵は踏んでやっつけろ ／ ◆コインを集めてゴールを目指せ
    </div>
    <a href="https://www.youtube.com/watch?v=pRhT6tMlGOI" target="_blank" rel="noopener" class="video-btn">▶ 作り方の動画</a>
  </div>

  <!-- クリア / ゲームオーバー -->
  <div id="endScreen" class="screen hidden">
    <div id="endTitle" class="big-result win">CLEAR!</div>
    <div id="endMsg" class="subtitle"></div>
    <button class="btn" id="retryBtn">↻ もう一度</button>
  </div>

  <!-- 裏技呼び出しボタン（U） -->
  <div id="cheatBtn" title="裏技 (U)">U</div>

  <!-- 裏技パスワード入力ポップアップ -->
  <div id="cheatPop">
    <div class="cheat-box">
      <h3>SECRET CODE</h3>
      <p>パスワードを入力してください</p>
      <input id="cheatInput" type="text" autocomplete="off" placeholder="• • • • • •" maxlength="20">
      <div id="cheatMsg"></div>
      <div class="cheat-btns">
        <button id="cheatCancel">とじる</button>
        <button id="cheatOk">OK</button>
      </div>
    </div>
  </div>
</div><!-- /#wrap -->

  <!-- モバイル操作（ゲーム画面の下） -->
  <div id="touch">
    <div class="dpad">
      <div class="tbtn" id="btnLeft">◀</div>
      <div class="tbtn" id="btnRight">▶</div>
    </div>
    <div class="tbtn" id="btnJump">JUMP</div>
  </div>
</div><!-- /#stage -->

<script>
// ---------- サウンド（Web Audio API・外部ファイル不要） ----------
let actx=null, masterGain=null, musicGain=null, soundOn=true;
function initAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();
  masterGain = actx.createGain(); masterGain.gain.value=0.6; masterGain.connect(actx.destination);
  musicGain = actx.createGain(); musicGain.gain.value=0.32; musicGain.connect(masterGain);
}
// 効果音：1ショットのオシレーター
function blip(type, f0, f1, dur, vol){
  if(!actx || !soundOn) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur);
}
function sfxJump(){ blip('square', 420, 880, 0.18, 0.35); }
function sfxCoin(){ blip('square', 1050, 1500, 0.12, 0.3); }
function sfxStomp(){ blip('sawtooth', 300, 80, 0.18, 0.35); }
function sfxDie(){ blip('triangle', 500, 60, 0.6, 0.4); }
function sfxClear(){ [523,659,784,1047].forEach((f,i)=>{ setTimeout(()=>blip('square',f,f,0.16,0.3), i*120); }); }

// ---------- BGM（手続き生成・ループ） ----------
// ステージごとのキー違いの簡易チップチューン
const BGM_TRACKS = [
  { tempo:0.16, bass:[131,131,98,110], lead:[523,659,587,523,440,523,659,784] },     // 1面
  { tempo:0.15, bass:[147,147,110,123], lead:[587,740,659,587,494,587,740,880] },     // 2面（やや明るく速め）
  { tempo:0.14, bass:[165,165,123,147], lead:[659,784,880,784,659,587,659,988] },     // 3面（空・高め）
  { tempo:0.115, bass:[110,110,98,87], lead:[440,415,392,440,523,494,440,330] },      // ボス（緊迫・速い）
];
let bgmTimer=null, bgmStep=0;
function startBGM(){
  stopBGM();
  bgmStep=0;
  const tick=()=>{
    if(!actx || !soundOn || state!=='play'){ return; }
    const tr=BGM_TRACKS[Math.min(curLevel, BGM_TRACKS.length-1)];
    const t=actx.currentTime;
    // ベース（1拍ごと）
    if(bgmStep%2===0){
      const bf=tr.bass[(bgmStep/2)%tr.bass.length];
      const ob=actx.createOscillator(), gb=actx.createGain();
      ob.type='triangle'; ob.frequency.value=bf;
      gb.gain.setValueAtTime(0.0001,t); gb.gain.linearRampToValueAtTime(0.5,t+0.02);
      gb.gain.exponentialRampToValueAtTime(0.0001,t+tr.tempo*1.8);
      ob.connect(gb); gb.connect(musicGain); ob.start(t); ob.stop(t+tr.tempo*1.9);
    }
    // リード（毎ステップ）
    const lf=tr.lead[bgmStep%tr.lead.length];
    const ol=actx.createOscillator(), gl=actx.createGain();
    ol.type='square'; ol.frequency.value=lf;
    gl.gain.setValueAtTime(0.0001,t); gl.gain.linearRampToValueAtTime(0.22,t+0.02);
    gl.gain.exponentialRampToValueAtTime(0.0001,t+tr.tempo*0.9);
    ol.connect(gl); gl.connect(musicGain); ol.start(t); ol.stop(t+tr.tempo);
    bgmStep++;
  };
  const curTr=BGM_TRACKS[Math.min(curLevel, BGM_TRACKS.length-1)];
  bgmTimer=setInterval(tick, curTr.tempo*1000*2);
}
function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
function toggleSound(){
  soundOn=!soundOn;
  const b=document.getElementById('soundBtn');
  if(b) b.textContent = soundOn ? '🔊' : '🔇';
  if(soundOn && state==='play') startBGM(); else stopBGM();
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- 入力 ----------
const keys = { left:false, right:false, jump:false };
let cheatOpen=false;
addEventListener('keydown', e=>{
  // 裏技呼び出し（Uキー）
  if((e.key==='u'||e.key==='U') && !cheatOpen){ openCheat(); return; }
  if(cheatOpen) return; // ポップアップ中はゲーム操作を無効化
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left=true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right=true;
  if([' ','ArrowUp','w','W'].includes(e.key)){ keys.jump=true; e.preventDefault(); }
});
addEventListener('keyup', e=>{
  if(cheatOpen) return;
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left=false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right=false;
  if([' ','ArrowUp','w','W'].includes(e.key)) keys.jump=false;
});
function bindTouch(id, key){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); keys[key]=true; };
  const off = e=>{ e.preventDefault(); keys[key]=false; };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
bindTouch('btnLeft','left'); bindTouch('btnRight','right'); bindTouch('btnJump','jump');

// ---------- レベルデータ ----------
// 文字マップ: # 地面/ブロック  = 浮きブロック  ? コインブロック  o コイン  E 敵  F ゴール旗  P スタート
const TILE = 48;
// ステージ1（夜・ネオン）
const LEVEL1 = [
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                ooo                                                                             ",
"                ====                       ??                                                   ",
"          ooo            ooo        oooo          ooo        ooo          oooo                  ",
"  P               E                          E                      E                   F        ",
"##########   ############   ########    ##########   ########   ##########    ##################",
"##########   ############   ########    ##########   ########   ##########    ##################",
];
// ステージ2（昼・敵多め）
const LEVEL2 = [
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                ooo                                             ooo                             ",
"                ====                     ??                     ====                            ",
"          ooo          oooo        ooo         oooo        ooo         oooo         ooo         ",
"  P              E            E           E           E           E            E           F    ",
"##########   ##########    ########   #########    ########   #########    #########   #########",
"##########   ##########    ########   #########    ########   #########    #########   #########",
];
// ステージ3（空・浮島）
const LEVEL3 = [
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"                                                                                                ",
"               ooo                              ooo                           ooo               ",
"               ====                 ??          ====                          ====              ",
"         ooo        ooo       ooo        ooo       ooo        ooo       ooo       ooo           ",
"  P            E          E          E          E         E          E         E          F     ",
"#########   ########   #######   ########   #######   ########   #######   #######   ###########",
"#########   ########   #######   ########   #######   ########   #######   #######   ###########",
];
// ステージ4（ラスボス戦・1画面固定アリーナ）
const LEVEL4 = [
"                    ",
"                    ",
"#                  #",
"#                  #",
"#                  #",
"#                  #",
"#                  #",
"#    ====   ====   #",
"#            B     #",
"#   P              #",
"####################",
"####################",
];
const LEVELS = [LEVEL1, LEVEL2, LEVEL3, LEVEL4];
const LEVEL_NAMES = ['1-1', '2-1', '3-1', 'BOSS'];

let curLevel = 0;
let levelMap = LEVELS[0];
let ROWS, COLS, levelW, levelH;

let solids=[], coins=[], enemies=[], goal=null, startX=0, startY=0;

function loadLevel(idx){
  curLevel = idx;
  levelMap = LEVELS[idx];
  ROWS = levelMap.length;
  COLS = Math.max(...levelMap.map(r=>r.length));
  levelW = COLS * TILE;
  levelH = ROWS * TILE;
  buildLevel();
}

function buildLevel(){
  solids=[]; coins=[]; enemies=[]; goal=null; boss=null; projectiles=[];
  for(let r=0;r<ROWS;r++){
    const row = levelMap[r];
    for(let c=0;c<row.length;c++){
      const ch = row[c];
      const x=c*TILE, y=r*TILE;
      if(ch==='#') solids.push({x,y,w:TILE,h:TILE,type:'ground'});
      else if(ch==='=') solids.push({x,y,w:TILE,h:TILE,type:'brick'});
      else if(ch==='?'){ solids.push({x,y,w:TILE,h:TILE,type:'q'}); coins.push({x:x+TILE/2,y:y-TILE*0.2,got:false,fromBox:true,by:y}); }
      else if(ch==='o') coins.push({x:x+TILE/2,y:y+TILE/2,got:false});
      else if(ch==='E') enemies.push({x,y:y+TILE-40,w:40,h:40,dir:-1,vy:0,alive:true,squash:0});
      else if(ch==='F'){ goal={x:x+TILE/2,y,h:TILE*7}; }
      else if(ch==='P'){ startX=x; startY=y; }
      else if(ch==='B'){
        const bw=96, bh=96, groundTop=(ROWS-2)*TILE;
        boss = { x, y:groundTop-bh, w:bw, h:bh, vx:2, vy:0, dir:-1,
                 hp:5, maxhp:5, invul:0, alive:true, defeated:0,
                 shootCd:90, hop:0, t:0, baseGround:groundTop };
      }
    }
  }
}

// ---------- プレイヤー ----------
const player = {
  x:0,y:0,w:34,h:44,vx:0,vy:0,onGround:false,
  face:1, alive:true, win:false, anim:0, jumpHeld:false, invul:0
};
let coinsGot=0, lives=3, camX=0, state='start', particles=[], floatTexts=[];
let boss=null, projectiles=[], shakeT=0;

function resetPlayer(toStart){
  player.x = toStart ? startX : player.x;
  player.y = toStart ? startY : player.y;
  player.vx=0; player.vy=0; player.alive=true; player.win=false; player.invul=90;
}
function resetGame(){
  loadLevel(0);
  coinsGot=0; lives=3; particles=[]; floatTexts=[];
  resetPlayer(true);
  state='play';
  updateHUD();
  startBGM();
}
function startNextLevel(){
  loadLevel(curLevel+1);
  particles=[]; floatTexts=[];
  resetPlayer(true);
  state='play';
  updateHUD();
  startBGM();
}

// ---------- 物理 ----------
const GRAV=0.78, MOVE=1.0, MAXVX=7.4, FRICTION=0.82, JUMP=-18.5;

function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function updatePlayer(){
  if(!player.alive){ // 死亡演出（上に飛んで落ちる）
    player.vy += GRAV; player.y += player.vy; return;
  }
  if(player.win){ player.vy+=GRAV; if(player.onGround){} player.x+=1.5; player.y+=player.vy;
    // 旗を滑り降りる/ゴール後右に歩く簡易演出
    collideY(); return; }

  if(keys.left){ player.vx -= MOVE; player.face=-1; }
  if(keys.right){ player.vx += MOVE; player.face=1; }
  if(!keys.left && !keys.right) player.vx *= FRICTION;
  player.vx = Math.max(-MAXVX, Math.min(MAXVX, player.vx));
  if(Math.abs(player.vx)<0.05) player.vx=0;

  // ジャンプ
  if(keys.jump && player.onGround && !player.jumpHeld){
    player.vy = JUMP; player.onGround=false; player.jumpHeld=true;
    spawnParticles(player.x+player.w/2, player.y+player.h, 8, '#9fd0ff');
    sfxJump();
  }
  if(!keys.jump) player.jumpHeld=false;
  // 可変ジャンプ
  if(!keys.jump && player.vy<-4) player.vy = -4;

  player.vy += GRAV;
  if(player.vy>18) player.vy=18;

  // X移動 + 衝突
  player.x += player.vx;
  collideX();
  // Y移動 + 衝突
  player.y += player.vy;
  player.onGround=false;
  collideY();

  // 場外
  if(player.x<0){ player.x=0; player.vx=0; }
  if(player.x+player.w>levelW){ player.x=levelW-player.w; }
  if(player.y>levelH+100) die();

  if(player.invul>0) player.invul--;
  player.anim += Math.abs(player.vx)*0.05;
}

function collideX(){
  for(const s of solids){
    if(aabb(player,s)){
      if(player.vx>0) player.x = s.x - player.w;
      else if(player.vx<0) player.x = s.x + s.w;
      player.vx=0;
    }
  }
}
function collideY(){
  for(const s of solids){
    if(aabb(player,s)){
      if(player.vy>0){ player.y = s.y - player.h; player.vy=0; player.onGround=true; }
      else if(player.vy<0){
        player.y = s.y + s.h; player.vy=0;
        if(s.type==='q' && !s.hit){ // コインブロック
          s.hit=true;
          for(const co of coins){ if(co.fromBox && !co.got && Math.abs(co.x-(s.x+TILE/2))<6 && Math.abs(co.by-s.y)<TILE){ co.got=true; gainCoin(co.x,co.y); } }
          spawnParticles(s.x+TILE/2, s.y, 10, '#ffd34d');
        }
      }
    }
  }
}

function updateCoins(){
  // 空中コインの取得判定
  for(const c of coins){
    if(c.got || c.fromBox) continue;
    const box = { x:c.x-16, y:c.y-16, w:32, h:32 };
    if(aabb(player, box)){ c.got=true; gainCoin(c.x, c.y); }
  }
}

function updateEnemies(){
  for(const e of enemies){
    if(!e.alive){ if(e.squash>0) e.squash--; continue; }
    e.x += e.dir*1.5;
    // 重力
    e.vy += GRAV; e.y += e.vy;
    let grounded=false;
    for(const s of solids){
      if(aabb(e,s)){
        if(e.vy>0){ e.y=s.y-e.h; e.vy=0; grounded=true; }
      }
    }
    // 端で反転（前方に床がなければ反転）
    const ahead = { x:e.x + (e.dir>0?e.w+2:-2), y:e.y+e.h+2, w:2, h:4 };
    let floorAhead=false;
    for(const s of solids){ if(aabb(ahead,s)){ floorAhead=true; break; } }
    // 壁衝突
    for(const s of solids){
      const side={x:e.x+(e.dir>0?e.w:-2),y:e.y+4,w:2,h:e.h-8};
      if(aabb(side,s)){ e.dir*=-1; break; }
    }
    if(grounded && !floorAhead) e.dir*=-1;

    // プレイヤーとの判定
    if(player.alive && !player.win && aabb(player,e)){
      if(player.vy>0 && player.y+player.h - player.vy <= e.y+10){
        // 踏みつけ
        e.alive=false; e.squash=18; player.vy=-10;
        gainScoreText(e.x+e.w/2,e.y,'踏破!');
        spawnParticles(e.x+e.w/2,e.y+e.h/2,14,'#ff6bd6');
        sfxStomp();
      } else if(player.invul<=0){
        die();
      }
    }
  }
}

function gainCoin(x,y){
  coinsGot++; updateHUD();
  spawnParticles(x,y,8,'#ffd34d');
  gainScoreText(x,y,'+◆');
  sfxCoin();
}
function gainScoreText(x,y,t){ floatTexts.push({x,y,t,life:50}); }

function die(){
  if(!player.alive) return;
  player.alive=false; player.vy=-12; lives--; updateHUD();
  spawnParticles(player.x+player.w/2,player.y+player.h/2,20,'#ff6b8a');
  sfxDie(); stopBGM();
  setTimeout(()=>{
    if(lives<=0){ endGame(false); }
    else { resetPlayer(true); startBGM(); }
  }, 1100);
}

function checkGoal(){
  if(goal && player.alive && !player.win && player.x+player.w > goal.x){
    player.win=true;
    spawnParticles(goal.x, player.y, 30, '#7CFFB2');
    sfxClear(); stopBGM();
    if(curLevel < LEVELS.length-1){
      const nextIsBoss = (curLevel+1 === LEVELS.length-1);
      gainScoreText(player.x+player.w/2, player.y-20, nextIsBoss ? '⚠ BOSS APPROACHING ⚠' : 'STAGE CLEAR!');
      setTimeout(()=>startNextLevel(), 1500);
    } else {
      setTimeout(()=>endGame(true), 1400);
    }
  }
}

// ---------- ボス戦 ----------
function updateBoss(){
  if(!boss) return;
  boss.t++;
  if(boss.invul>0) boss.invul--;

  if(!boss.alive){ // 撃破演出
    boss.defeated++;
    boss.y += 0.6; // ゆっくり沈む
    if(boss.defeated%5===0)
      spawnParticles(boss.x+boss.w/2+(Math.sin(boss.t)*boss.w/2), boss.y+boss.h/2, 10, '#ffd34d');
    return;
  }

  // HPが減るほど攻撃的に
  const phase = 1 + (boss.maxhp - boss.hp)*0.22;
  // 横移動（アリーナ内を往復）
  boss.x += boss.dir*2*phase;
  const leftLim = TILE, rightLim = (COLS-1)*TILE - boss.w;
  if(boss.x<=leftLim){ boss.x=leftLim; boss.dir=1; }
  if(boss.x>=rightLim){ boss.x=rightLim; boss.dir=-1; }
  // 上下のホップ
  boss.hop += 0.06*phase;
  const hover = Math.abs(Math.sin(boss.hop))*34;
  boss.y = boss.baseGround - boss.h - hover;

  // 弾を撃つ
  boss.shootCd--;
  if(boss.shootCd<=0){
    boss.shootCd = Math.max(38, 90 - (boss.maxhp-boss.hp)*12);
    shootProjectile();
  }

  // プレイヤーとの接触
  if(player.alive && !player.win && aabb(player,boss)){
    // 現在の足位置がボスの上半分にあり、かつ落下中なら「踏みつけ」
    const fromAbove = player.vy>0 && (player.y+player.h) <= boss.y + boss.h*0.6;
    if(boss.invul>0){
      // 無敵中（被弾直後の点滅）は素通り：ダメージも踏みつけも無し
    } else if(fromAbove){
      hitBoss();
      player.y = boss.y - player.h;  // 頭の上にスナップして確実に乗る
      player.vy = -13;
    } else if(player.invul<=0){
      die();
    }
  }
}
function shootProjectile(){
  if(!boss) return;
  const sx=boss.x+boss.w/2, sy=boss.y+boss.h*0.55;
  const dx=(player.x+player.w/2)-sx, dy=(player.y+player.h/2)-sy;
  const d=Math.hypot(dx,dy)||1, sp=5.5;
  projectiles.push({x:sx,y:sy,vx:dx/d*sp,vy:dy/d*sp-1.5,r:11,life:200,t:0});
  blip('sawtooth',230,150,0.12,0.22);
}
function updateProjectiles(){
  for(const p of projectiles){
    p.t++; p.vy+=0.12; p.x+=p.vx; p.y+=p.vy; p.life--;
    if(player.alive && !player.win && player.invul<=0){
      const box={x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2};
      if(aabb(player,box)){ p.life=0; die(); }
    }
  }
  projectiles = projectiles.filter(p=> p.life>0 && p.y<levelH+60 && p.x>-50 && p.x<levelW+50);
}
function hitBoss(){
  boss.hp--; boss.invul=50; shakeT=16;
  spawnParticles(boss.x+boss.w/2, boss.y, 24, '#ff5e9e');
  sfxStomp();
  if(boss.hp<=0){
    boss.alive=false; boss.defeated=1; projectiles=[];
    spawnParticles(boss.x+boss.w/2, boss.y+boss.h/2, 44, '#ffd34d');
    sfxClear(); stopBGM();
    gainScoreText(boss.x+boss.w/2, boss.y-12, 'BOSS DOWN!');
    setTimeout(()=>endGame(true), 2300);
  } else {
    gainScoreText(boss.x+boss.w/2, boss.y-12, 'HIT! 残り'+boss.hp);
  }
}

// ---------- パーティクル ----------
function spawnParticles(x,y,n,color){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.7)*7,life:30+Math.random()*20,color,size:2+Math.random()*4});
  }
}
function updateParticles(){
  for(const p of particles){ p.vx*=0.96; p.vy+=0.3; p.x+=p.vx; p.y+=p.vy; p.life--; }
  particles = particles.filter(p=>p.life>0);
  for(const f of floatTexts){ f.y-=0.8; f.life--; }
  floatTexts = floatTexts.filter(f=>f.life>0);
}

// ---------- カメラ ----------
function updateCamera(){
  const target = player.x + player.w/2 - W/2;
  camX += (target - camX)*0.12;
  camX = Math.max(0, Math.min(levelW - W, camX));
}

// ---------- 描画 ----------
let bgStars=[];
for(let i=0;i<80;i++) bgStars.push({x:Math.random()*W,y:Math.random()*H*0.7,s:Math.random()*2+0.5,sp:0.2+Math.random()*0.6});
let bgClouds=[];
for(let i=0;i<7;i++) bgClouds.push({x:Math.random()*1400,y:40+Math.random()*180,s:0.6+Math.random()*0.9,sp:0.1+Math.random()*0.2});

function drawBG(){
  if(curLevel===3) drawBGBoss();
  else if(curLevel===2) drawBGSky();
  else if(curLevel===1) drawBGDay();
  else drawBGNight();
}

function drawBGBoss(){
  // 禍々しい暗赤のアリーナ
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0212'); g.addColorStop(0.5,'#3a0820'); g.addColorStop(1,'#0a0008');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 後光（脈動）
  const pulse = 0.5+Math.sin(Date.now()/240)*0.25;
  const rg=ctx.createRadialGradient(W/2,H*0.42,40,W/2,H*0.42,W*0.6);
  rg.addColorStop(0,`rgba(255,40,120,${0.22*pulse})`); rg.addColorStop(1,'rgba(255,40,120,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  // 走る光のスリット
  ctx.strokeStyle='rgba(255,80,150,0.12)'; ctx.lineWidth=2;
  for(let i=0;i<10;i++){
    const yy=((Date.now()/20 + i*70)% (H+140))-70;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy-40); ctx.stroke();
  }
  // 浮遊する紫の柱（背景）
  ctx.fillStyle='rgba(60,10,50,0.6)';
  for(let i=0;i<5;i++){ const x=80+i*200; ctx.fillRect(x,H*0.3,40,H); }
}

function drawBGNight(){
  // 縦グラデ空
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1140'); g.addColorStop(0.5,'#3a1a5e'); g.addColorStop(1,'#0d0820');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 星（パララックス）
  ctx.fillStyle='#cfe0ff';
  for(const st of bgStars){
    const sx = (st.x - camX*0.15*st.sp) % W; const x = sx<0?sx+W:sx;
    ctx.globalAlpha = 0.4+st.s*0.2;
    ctx.fillRect(x, st.y, st.s, st.s);
  }
  ctx.globalAlpha=1;

  // 月
  const mx = 720 - camX*0.1;
  const grd=ctx.createRadialGradient(mx,110,10,mx,110,70);
  grd.addColorStop(0,'rgba(255,240,200,0.95)'); grd.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(mx,110,70,0,7); ctx.fill();
  ctx.fillStyle='#fff7dc'; ctx.beginPath(); ctx.arc(mx,110,38,0,7); ctx.fill();

  // 遠景の山（パララックス）
  drawHills(camX*0.3, H*0.72, '#241252', 220, 140);
  drawHills(camX*0.5, H*0.82, '#311a66', 160, 110);
}

function drawBGDay(){
  // 青空グラデ
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#5ec8ff'); g.addColorStop(0.55,'#9ee0ff'); g.addColorStop(1,'#dff6ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 太陽
  const sx = 760 - camX*0.08;
  const sg=ctx.createRadialGradient(sx,100,10,sx,100,90);
  sg.addColorStop(0,'rgba(255,250,210,1)'); sg.addColorStop(0.5,'rgba(255,236,150,0.6)'); sg.addColorStop(1,'rgba(255,236,150,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,100,90,0,7); ctx.fill();
  ctx.fillStyle='#fff6c8'; ctx.beginPath(); ctx.arc(sx,100,40,0,7); ctx.fill();

  // 雲（パララックス）
  for(const cl of bgClouds){
    let x = (cl.x - camX*0.2) % 1400; if(x<-200) x+=1400;
    drawCloud(x, cl.y, 50*cl.s);
  }

  // 遠景の丘（緑）
  drawHills(camX*0.3, H*0.74, '#3fa34d', 240, 120);
  drawHills(camX*0.5, H*0.84, '#2f8a3c', 170, 95);
}
function drawBGSky(){
  // 高い空：上は濃い青、下は明るい水色
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2e7fe0'); g.addColorStop(0.5,'#6cb6ff'); g.addColorStop(1,'#bfe8ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 太陽の光輪
  const sx=160-camX*0.05;
  const sg=ctx.createRadialGradient(sx,90,10,sx,90,120);
  sg.addColorStop(0,'rgba(255,255,235,0.9)'); sg.addColorStop(1,'rgba(255,255,235,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,90,120,0,7); ctx.fill();

  // 遠くの雲海（下部）
  ctx.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<6;i++){
    let x=((i*220)-camX*0.25)%1320; if(x<-160)x+=1320;
    drawCloud(x, H*0.7+ (i%2)*30, 90);
  }
  // 流れる雲（手前・大きめ）
  for(const cl of bgClouds){
    let x=(cl.x - camX*0.35) % 1400; if(x<-220) x+=1400;
    drawCloud(x, cl.y, 70*cl.s);
  }
  // 浮遊する小島（シルエット）
  ctx.fillStyle='rgba(120,180,150,0.5)';
  for(let i=0;i<4;i++){
    let x=((i*340)-camX*0.5)%1360; if(x<-120)x+=1360;
    const y=H*0.55+(i%2)*60;
    ctx.beginPath(); ctx.ellipse(x,y,55,16,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-45,y); ctx.lineTo(x,y+40); ctx.lineTo(x+45,y); ctx.fill();
  }
}
function drawCloud(x,y,r){
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(x,y,r*0.6,0,7);
  ctx.arc(x+r*0.7,y+6,r*0.5,0,7);
  ctx.arc(x-r*0.7,y+8,r*0.45,0,7);
  ctx.arc(x+r*0.2,y-r*0.3,r*0.5,0,7);
  ctx.fill();
}
function drawHills(off, baseY, color, spacing, height){
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(-50,H);
  for(let x=-spacing;x<W+spacing;x+=4){
    const wx = x+off;
    const y = baseY - Math.abs(Math.sin(wx/spacing))*height;
    ctx.lineTo(x - (off%spacing), y);
  }
  ctx.lineTo(W+50,H); ctx.closePath(); ctx.fill();
}

function drawTile(s){
  const x=s.x-camX, y=s.y;
  if(x<-TILE||x>W) return;
  if(s.type==='ground'){
    if(curLevel===3){
      // ボスアリーナ：暗い金属床＋ネオン縁
      const g=ctx.createLinearGradient(0,y,0,y+TILE);
      g.addColorStop(0,'#2a0e22'); g.addColorStop(1,'#140510');
      ctx.fillStyle=g; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='rgba(255,60,140,0.7)'; ctx.fillRect(x,y,TILE,4);
      ctx.strokeStyle='rgba(120,20,70,0.6)'; ctx.lineWidth=2; ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
    } else if(curLevel===2){
      // 空ステージ：雲のブロック
      const g=ctx.createLinearGradient(0,y,0,y+TILE);
      g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#bcd6ee');
      ctx.fillStyle=g; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.arc(x+12,y+10,12,0,7); ctx.arc(x+TILE-12,y+10,12,0,7); ctx.arc(x+TILE/2,y+8,15,0,7);
      ctx.fill();
      ctx.strokeStyle='rgba(150,180,210,0.6)'; ctx.lineWidth=2; ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
    } else {
      const g=ctx.createLinearGradient(0,y,0,y+TILE);
      if(curLevel===1){ g.addColorStop(0,'#b5793f'); g.addColorStop(1,'#7a4a1f'); }
      else { g.addColorStop(0,'#2a6cf0'); g.addColorStop(1,'#143a8a'); }
      ctx.fillStyle=g; ctx.fillRect(x,y,TILE,TILE);
      // 上面（昼=芝/夜=ネオン）
      ctx.fillStyle = curLevel===1 ? '#5ec85a' : 'rgba(120,200,255,0.6)';
      ctx.fillRect(x,y,TILE, curLevel===1?9:5);
      if(curLevel===1){ ctx.fillStyle='#7CFFB2'; ctx.fillRect(x,y,TILE,3); }
      ctx.strokeStyle = curLevel===1?'rgba(60,30,5,0.5)':'rgba(10,20,60,0.5)';
      ctx.lineWidth=2; ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
    }
  } else if(s.type==='brick'){
    ctx.fillStyle='#7a4bd0'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle='rgba(180,140,255,0.5)'; ctx.fillRect(x,y,TILE,4);
    ctx.strokeStyle='rgba(40,10,80,0.5)'; ctx.lineWidth=2;
    ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
    ctx.beginPath(); ctx.moveTo(x,y+TILE/2); ctx.lineTo(x+TILE,y+TILE/2);
    ctx.moveTo(x+TILE/2,y); ctx.lineTo(x+TILE/2,y+TILE/2); ctx.stroke();
  } else if(s.type==='q'){
    const hit=s.hit;
    ctx.fillStyle = hit ? '#5a4a2a' : '#ffb12e';
    ctx.fillRect(x,y,TILE,TILE);
    if(!hit){
      const pulse = 0.5+Math.sin(Date.now()/200)*0.3;
      ctx.fillStyle=`rgba(255,255,200,${pulse})`; ctx.fillRect(x+4,y+4,TILE-8,TILE-8);
      ctx.fillStyle='#7a4a00'; ctx.font='bold 30px Arial'; ctx.textAlign='center';
      ctx.fillText('?', x+TILE/2, y+TILE/2+11);
    }
    ctx.strokeStyle='rgba(80,40,0,0.6)'; ctx.lineWidth=2; ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
  }
}

function drawCoin(c){
  if(c.got) return;
  const x=c.x-camX, y=c.y;
  if(x<-20||x>W+20) return;
  const bob = Math.sin(Date.now()/300 + c.x)*4;
  const ww = Math.abs(Math.cos(Date.now()/250 + c.x))*10+4; // 回転
  ctx.save();
  ctx.translate(x, y+bob);
  ctx.fillStyle='#ffd34d';
  ctx.beginPath(); ctx.ellipse(0,0,ww,14,0,0,7); ctx.fill();
  ctx.strokeStyle='#b8860b'; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowColor='#ffd34d'; ctx.shadowBlur=15;
  ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.ellipse(-ww*0.3,-2,ww*0.3,5,0,0,7); ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  const x=e.x-camX, y=e.y;
  if(x<-60||x>W+60) return;
  if(!e.alive){
    if(e.squash>0){ // つぶれ演出
      ctx.fillStyle='#ff4d7d';
      ctx.fillRect(x, y+e.h-10, e.w, 10);
    }
    return;
  }
  const wob = Math.sin(Date.now()/120 + e.x)*3;
  // 体
  ctx.save();
  ctx.shadowColor='#ff2d7a'; ctx.shadowBlur=14;
  const g=ctx.createLinearGradient(0,y,0,y+e.h);
  g.addColorStop(0,'#ff5e9e'); g.addColorStop(1,'#c01e6a');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.roundRect(x, y+wob, e.w, e.h-wob, [14,14,8,8]); ctx.fill();
  ctx.restore();
  // トゲ
  ctx.fillStyle='#ffd0e6';
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(x+8+i*12, y+wob);
    ctx.lineTo(x+14+i*12, y+wob-8);
    ctx.lineTo(x+20+i*12, y+wob);
    ctx.fill();
  }
  // 目
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x+13,y+18+wob,6,0,7); ctx.arc(x+27,y+18+wob,6,0,7); ctx.fill();
  ctx.fillStyle='#1a0010';
  const ed = e.dir*2;
  ctx.beginPath(); ctx.arc(x+13+ed,y+19+wob,3,0,7); ctx.arc(x+27+ed,y+19+wob,3,0,7); ctx.fill();
}

function drawGoal(){
  if(!goal) return;
  const x=goal.x-camX;
  if(x<-50||x>W+50) return;
  // ポール
  ctx.fillStyle='#cfe0ff'; ctx.fillRect(x-3, goal.y-TILE*6, 6, TILE*7);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,goal.y-TILE*6,8,0,7); ctx.fill();
  // 旗
  const wave = Math.sin(Date.now()/200)*6;
  ctx.fillStyle='#7CFFB2'; ctx.shadowColor='#7CFFB2'; ctx.shadowBlur=18;
  ctx.beginPath();
  ctx.moveTo(x, goal.y-TILE*6+6);
  ctx.lineTo(x+50+wave, goal.y-TILE*6+22);
  ctx.lineTo(x, goal.y-TILE*6+40);
  ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#06122a'; ctx.font='bold 16px Arial'; ctx.textAlign='center';
  ctx.fillText('★', x+22, goal.y-TILE*6+28);
}

function drawPlayer(){
  if(player.invul>0 && Math.floor(Date.now()/80)%2===0 && player.alive) return; // 点滅
  const x=player.x-camX, y=player.y;
  const lean = player.vx*0.6;
  ctx.save();
  ctx.translate(x+player.w/2, y+player.h/2);
  ctx.scale(player.face,1);
  ctx.rotate(lean*0.01);
  ctx.translate(-player.w/2,-player.h/2);

  // グロー
  ctx.shadowColor='#5ff'; ctx.shadowBlur=18;
  // 体（スーツ）
  const g=ctx.createLinearGradient(0,0,0,player.h);
  g.addColorStop(0,'#4ff'); g.addColorStop(1,'#2a8bff');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.roundRect(4,14,player.w-8,player.h-14,[6,6,7,7]); ctx.fill();
  ctx.shadowBlur=0;
  // 足（走りアニメ）
  const legSwing = player.onGround ? Math.sin(player.anim)*5 : 4;
  ctx.fillStyle='#1f5fd0';
  ctx.fillRect(7, player.h-6, 9, 7+legSwing*0.4);
  ctx.fillRect(player.w-16, player.h-6, 9, 7-legSwing*0.4);
  // 頭
  ctx.fillStyle='#ffe0c0';
  ctx.beginPath(); ctx.arc(player.w/2, 12, 11, 0, 7); ctx.fill();
  // ヘルメット/バイザー
  ctx.fillStyle='#ff6bd6'; ctx.shadowColor='#ff6bd6'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(player.w/2, 9, 11, Math.PI, 0); ctx.fill();
  ctx.shadowBlur=0;
  // バイザー光
  ctx.fillStyle='#103a6a';
  ctx.fillRect(player.w/2-2, 9, 9, 6);
  ctx.fillStyle='#7df'; ctx.fillRect(player.w/2+2, 10, 3, 3);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){ const m=shakeT*0.6; ctx.translate((Math.sin(shakeT*5))*m, (Math.cos(shakeT*7))*m); }
  drawBG();
  for(const s of solids) drawTile(s);
  for(const c of coins) drawCoin(c);
  drawGoal();
  for(const e of enemies) drawEnemy(e);
  drawBoss();
  drawProjectiles();
  // パーティクル
  for(const p of particles){
    ctx.globalAlpha = Math.min(1,p.life/30);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-camX, p.y, p.size, p.size);
  }
  ctx.globalAlpha=1;
  // フロートテキスト
  ctx.font='bold 20px Arial'; ctx.textAlign='center';
  for(const f of floatTexts){
    ctx.globalAlpha=Math.min(1,f.life/40);
    ctx.fillStyle='#fff'; ctx.shadowColor='#ffd34d'; ctx.shadowBlur=10;
    ctx.fillText(f.t, f.x-camX, f.y);
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  drawPlayer();

  // ビネット
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  ctx.restore();
  drawBossHP();
}

function drawProjectiles(){
  for(const p of projectiles){
    const x=p.x-camX, y=p.y;
    ctx.save();
    ctx.shadowColor='#ff3b3b'; ctx.shadowBlur=16;
    const g=ctx.createRadialGradient(x,y,2,x,y,p.r);
    g.addColorStop(0,'#fff'); g.addColorStop(0.4,'#ffd34d'); g.addColorStop(1,'#ff2d2d');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.fill();
    ctx.restore();
  }
}

function drawBoss(){
  if(!boss) return;
  const x=boss.x-camX, y=boss.y, w=boss.w, h=boss.h;
  const flash = boss.invul>0 && Math.floor(boss.t/4)%2===0;
  ctx.save();
  // オーラ
  ctx.shadowColor = boss.alive ? '#ff2d7a' : '#888';
  ctx.shadowBlur = 30;
  // 体
  const g=ctx.createLinearGradient(0,y,0,y+h);
  if(flash){ g.addColorStop(0,'#fff'); g.addColorStop(1,'#ffd0e0'); }
  else { g.addColorStop(0,'#7a1550'); g.addColorStop(0.5,'#c01e6a'); g.addColorStop(1,'#5a0e3a'); }
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,[26,26,16,16]); ctx.fill();
  ctx.shadowBlur=0;
  // トゲ（頭）
  ctx.fillStyle = flash ? '#fff' : '#ffd0e6';
  for(let i=0;i<5;i++){
    const sx=x+12+i*((w-24)/4);
    ctx.beginPath(); ctx.moveTo(sx-9,y+2); ctx.lineTo(sx,y-16); ctx.lineTo(sx+9,y+2); ctx.fill();
  }
  // 角
  ctx.fillStyle='#ffe04d';
  ctx.beginPath(); ctx.moveTo(x+6,y+10); ctx.lineTo(x-8,y-12); ctx.lineTo(x+18,y+4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+w-6,y+10); ctx.lineTo(x+w+8,y-12); ctx.lineTo(x+w-18,y+4); ctx.fill();
  // 目
  const eo = boss.dir*4;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x+w*0.34,y+h*0.42,13,0,7); ctx.arc(x+w*0.66,y+h*0.42,13,0,7); ctx.fill();
  ctx.fillStyle = boss.alive ? '#ff1f1f' : '#444';
  ctx.beginPath(); ctx.arc(x+w*0.34+eo,y+h*0.44,7,0,7); ctx.arc(x+w*0.66+eo,y+h*0.44,7,0,7); ctx.fill();
  // 怒り眉
  ctx.strokeStyle='#2a0015'; ctx.lineWidth=5; ctx.beginPath();
  ctx.moveTo(x+w*0.22,y+h*0.26); ctx.lineTo(x+w*0.44,y+h*0.36);
  ctx.moveTo(x+w*0.78,y+h*0.26); ctx.lineTo(x+w*0.56,y+h*0.36); ctx.stroke();
  // 口（牙）
  ctx.fillStyle='#1a0010'; ctx.beginPath();
  ctx.roundRect(x+w*0.3,y+h*0.62,w*0.4,14,7); ctx.fill();
  ctx.fillStyle='#fff';
  for(let i=0;i<4;i++){ const tx=x+w*0.33+i*(w*0.12); ctx.beginPath(); ctx.moveTo(tx,y+h*0.62); ctx.lineTo(tx+5,y+h*0.62+10); ctx.lineTo(tx+10,y+h*0.62); ctx.fill(); }
  ctx.restore();
}

function drawBossHP(){
  if(!boss || curLevel!==3) return;
  const bw=360, bh=20, bx=(W-bw)/2, by=46;
  // ラベル
  ctx.font='bold 16px Arial'; ctx.textAlign='center';
  ctx.fillStyle='#ffd0e6'; ctx.shadowColor='#ff2d7a'; ctx.shadowBlur=10;
  ctx.fillText('★ NEON OVERLORD ★', W/2, by-8);
  ctx.shadowBlur=0;
  // 枠
  ctx.fillStyle='rgba(10,5,20,0.7)'; ctx.fillRect(bx-3,by-3,bw+6,bh+6);
  ctx.strokeStyle='rgba(255,150,210,0.8)'; ctx.lineWidth=2; ctx.strokeRect(bx-3,by-3,bw+6,bh+6);
  // ゲージ
  const ratio = Math.max(0, boss.hp/boss.maxhp);
  const g=ctx.createLinearGradient(bx,0,bx+bw,0);
  g.addColorStop(0,'#ff2d2d'); g.addColorStop(0.5,'#ff6bd6'); g.addColorStop(1,'#ffd34d');
  ctx.fillStyle=g; ctx.fillRect(bx,by,bw*ratio,bh);
  // 区切り
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=2;
  for(let i=1;i<boss.maxhp;i++){ const sx=bx+bw*(i/boss.maxhp); ctx.beginPath(); ctx.moveTo(sx,by); ctx.lineTo(sx,by+bh); ctx.stroke(); }
}

// ---------- ループ ----------
function loop(){
  if(state==='play'){
    updatePlayer();
    updateCoins();
    updateEnemies();
    updateBoss();
    updateProjectiles();
    updateParticles();
    checkGoal();
    updateCamera();
  } else {
    updateBoss();
    updateProjectiles();
    updateParticles();
  }
  if(shakeT>0) shakeT--;
  render();
  requestAnimationFrame(loop);
}

// ---------- HUD / 画面遷移 ----------
function updateHUD(){
  document.getElementById('world').textContent=LEVEL_NAMES[curLevel];
  document.getElementById('coins').textContent=coinsGot;
  document.getElementById('lives').textContent=Math.max(0,lives);
}
function endGame(win){
  state='end';
  stopBGM();
  const sc=document.getElementById('endScreen');
  const t=document.getElementById('endTitle');
  const m=document.getElementById('endMsg');
  sc.classList.remove('hidden');
  if(win){ t.textContent='ALL CLEAR!'; t.className='big-result win';
    m.textContent='ラスボス撃破！全ステージ制覇！ ◆ '+coinsGot+' 枚ゲット'; }
  else { t.textContent='GAME OVER'; t.className='big-result lose';
    m.textContent='◆ '+coinsGot+' 枚 集めた'; }
}

document.getElementById('startBtn').onclick=()=>{
  initAudio(); if(actx.state==='suspended') actx.resume();
  document.getElementById('startScreen').classList.add('hidden');
  resetGame();
};
document.getElementById('retryBtn').onclick=()=>{
  initAudio(); if(actx.state==='suspended') actx.resume();
  document.getElementById('endScreen').classList.add('hidden');
  resetGame();
};
document.getElementById('soundBtn').onclick=toggleSound;

// ---------- 裏技（隠しコマンド） ----------
const SECRET_CODE = 'ramune';
const SECRET_STAGE = 3; // 0始まり → ボス戦
function openCheat(){
  cheatOpen=true;
  keys.left=keys.right=keys.jump=false; // 入力リセット
  const pop=document.getElementById('cheatPop');
  const inp=document.getElementById('cheatInput');
  document.getElementById('cheatMsg').textContent='';
  inp.value='';
  pop.classList.add('show');
  setTimeout(()=>inp.focus(), 30);
}
function closeCheat(){
  cheatOpen=false;
  document.getElementById('cheatPop').classList.remove('show');
}
function submitCheat(){
  const inp=document.getElementById('cheatInput');
  const msg=document.getElementById('cheatMsg');
  if(inp.value.trim().toLowerCase()===SECRET_CODE){
    closeCheat();
    initAudio(); if(actx.state==='suspended') actx.resume();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    startFromStage(SECRET_STAGE);
  } else {
    msg.textContent='パスワードが違います';
    inp.value=''; inp.focus();
  }
}
function startFromStage(idx){
  loadLevel(idx);
  coinsGot=0; lives=3; particles=[]; floatTexts=[];
  resetPlayer(true);
  state='play';
  updateHUD();
  startBGM();
}
document.getElementById('cheatBtn').onclick=()=>{ if(!cheatOpen) openCheat(); };
document.getElementById('cheatOk').onclick=submitCheat;
document.getElementById('cheatCancel').onclick=closeCheat;
document.getElementById('cheatInput').addEventListener('keydown', e=>{
  e.stopPropagation(); // ゲーム側キー処理に伝播させない
  if(e.key==='Enter') submitCheat();
  if(e.key==='Escape') closeCheat();
});

loadLevel(0);
loop();
</script>
